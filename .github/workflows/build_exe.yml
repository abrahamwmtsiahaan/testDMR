name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions

jobs:
  build-windows:
    name: Build LJK Reader (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --workpath windows_build/build --distpath windows_build/dist windows_build/app.spec

      - name: Create .env in dist folder
        shell: bash
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          # Gunakan secret API_URL jika diset di GitHub Secrets,
          # jika belum diset fallback ke URL staging default agar build tetap siap pakai.
          URL_VAL="${API_URL:-https://api-superapps-stg.ganeshaoperationexpert.com}"
          echo "api_url=${URL_VAL}" > windows_build/dist/.env

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LJK_Reader_Windows
          path: |
            windows_build/dist/LJK_Reader.exe
            windows_build/dist/.env
          if-no-files-found: error

