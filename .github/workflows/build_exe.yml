name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions

jobs:
  build-windows:
    name: Build LJK Reader (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --workpath windows_build/build --distpath windows_build/dist windows_build/app.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LJK_Reader_Windows_EXE
          path: windows_build/dist/LJK_Reader.exe
          if-no-files-found: error
